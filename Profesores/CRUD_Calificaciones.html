<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Calificaciones Parciales</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow">
        <a href="index.html" class="text-blue-600 text-sm font-semibold hover:underline">&larr; Volver al Home</a>
        <h2 class="text-2xl font-bold text-gray-800 mt-4 mb-6">CRUD de Calificaciones Parciales</h2>

        <!-- Formulario -->
        <form id="formCalif" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <input type="text" id="alumno" placeholder="Nombre Alumno" required class="p-2 border rounded">
            <input type="text" id="materia" placeholder="Materia" required class="p-2 border rounded">
            <input type="number" step="0.1" min="0" max="10" id="calificacion" placeholder="Calificación" required class="p-2 border rounded">
            <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Guardar</button>
        </form>

        <!-- Tabla -->
        <table class="w-full border-collapse border border-gray-200 text-left">
            <thead>
                <tr class="bg-gray-50">
                    <th class="border p-2">Alumno</th>
                    <th class="border p-2">Materia</th>
                    <th class="border p-2">Calificación</th>
                    <th class="border p-2">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCalif">
                <tr>
                    <td class="border p-2">Juan Pérez</td>
                    <td class="border p-2">Base de Datos</td>
                    <td class="border p-2">9.5</td>
                    <td class="border p-2"><button onclick="this.closest('tr').remove()" class="text-red-600 hover:underline">Eliminar</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="CRUD_Calificaciones.js"></script>
</body>
</html>
