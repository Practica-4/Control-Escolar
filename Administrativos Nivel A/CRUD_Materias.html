
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Materias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow">
        <a href="index.html" class="text-green-600 text-sm font-semibold hover:underline">&larr; Volver al Home</a>
        <h2 class="text-2xl font-bold text-gray-800 mt-4 mb-6">CRUD de Materias</h2>

        <form id="formMateria" class="flex gap-4 mb-6">
            <input type="text" id="nombreMateria" placeholder="Nombre de la Materia" required class="flex-1 p-2 border rounded">
            <input type="number" id="creditos" placeholder="Créditos" required class="w-32 p-2 border rounded">
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Agregar</button>
        </form>

        <ul id="listaMaterias" class="space-y-2">
            <li class="flex justify-between items-center p-3 border rounded bg-gray-50">
                <span>Administración de Base de Datos (8 Créditos)</span>
                <button onclick="this.parentElement.remove()" class="text-red-600 text-sm hover:underline">Eliminar</button>
            </li>
        </ul>
    </div>
    <script src="CRUD_Materias.js"></script>

</body>
</html>
