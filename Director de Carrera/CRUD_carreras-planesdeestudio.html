<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Carreras y Planes de Estudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow">
        <a href="index.html" class="text-yellow-600 text-sm font-semibold hover:underline">&larr; Volver al Home</a>
        <h2 class="text-2xl font-bold text-gray-800 mt-4 mb-6">CRUD de Carreras y Planes de Estudio</h2>

        <form id="formCarrera" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="nombreCarrera" placeholder="Nombre de la Carrera" required class="p-2 border rounded">
            <input type="text" id="planEstudio" placeholder="Clave Plan (ej. Plan 2024)" required class="p-2 border rounded">
            <button type="submit" class="bg-yellow-600 text-white p-2 rounded hover:bg-yellow-700 transition">Registrar Carrera</button>
        </form>

        <div id="contenedorCarreras" class="space-y-3">
            <div class="p-4 border rounded bg-gray-50 flex justify-between items-center">
                <div>
                    <h4 class="font-bold text-gray-800">Ing. en Desarrollo y Gestión de Software</h4>
                    <p class="text-sm text-gray-600">Plan de Estudio: Plan 2023-V2</p>
                </div>
                <button onclick="this.closest('div').remove()" class="text-red-600 text-sm hover:underline">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formCarrera').addEventListener('submit', function(e) {
            e.preventDefault();
            const carrera = document.getElementById('nombreCarrera').value;
            const plan = document.getElementById('planEstudio').value;

            const contenedor = document.getElementById('contenedorCarreras');
            const div = document.createElement('div');
            div.className = "p-4 border rounded bg-gray-50 flex justify-between items-center";
            div.innerHTML = `<div><h4 class="font-bold text-gray-800">${carrera}</h4><p class="text-sm text-gray-600">Plan de Estudio: ${plan}</p></div><button onclick="this.closest('div').remove()" class="text-red-600 text-sm hover:underline">Eliminar</button>`;
            contenedor.appendChild(div);
            this.reset();
        });
    </script>
</body>
</html>
